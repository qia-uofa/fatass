<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>fatass gui</title>
<style>
  :root {
    --bg: #1e1f24;
    --panel: #2a2c33;
    --border: #454852;
    --text: #e6e6e6;
    --dim: #9a9ea8;
    --accent: #5c9eff;
    --node-bg: #32343c;
    --node-bg-2: #3a3d47;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; flex-direction: column;
    background: var(--bg); color: var(--text);
    font: 13px/1.4 -apple-system, Segoe UI, sans-serif;
  }
  #topbar {
    display: flex; gap: 8px; padding: 8px; background: var(--panel);
    border-bottom: 1px solid var(--border); align-items: center;
  }
  #topbar input {
    flex: 1; background: #1b1c20; color: var(--text); border: 1px solid var(--border);
    border-radius: 4px; padding: 6px 8px; font-family: inherit;
  }
  #topbar button, .menu button {
    background: var(--accent); color: #fff; border: none; border-radius: 4px;
    padding: 6px 12px; cursor: pointer; font-family: inherit;
  }
  #topbar button:hover, .menu button:hover { filter: brightness(1.1); }
  #pwd { color: var(--dim); padding: 0 6px; white-space: nowrap; }
  #selection { color: var(--accent); padding: 0 6px; white-space: nowrap; }
  #main { flex: 1; display: flex; min-height: 0; }
  #canvas {
    flex: 1; overflow: auto; padding: 24px; cursor: default; position: relative;
    background: repeating-linear-gradient(45deg, #202126 0, #202126 1px, transparent 1px, transparent 16px);
  }
  #arrows { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 5; }
  #console {
    width: 420px; border-left: 1px solid var(--border); background: var(--panel);
    display: flex; flex-direction: column;
  }
  #console h3 { margin: 8px 12px; font-size: 12px; color: var(--dim); font-weight: 600; }
  #output {
    flex: 1; margin: 0 12px 12px; padding: 8px; background: #16171a; border-radius: 4px;
    overflow: auto; white-space: pre-wrap; font-family: Consolas, monospace; font-size: 12px;
  }
  .node {
    display: inline-block; vertical-align: top; margin: 6px; padding: 8px;
    background: var(--node-bg); border: 1px solid var(--border); border-radius: 6px;
    min-width: 160px; position: relative; cursor: pointer;
  }
  .node.selected-node { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .node-header { margin-bottom: 4px; }
  .node-name {
    font-weight: 600; cursor: pointer; border-radius: 3px; padding: 1px 3px; margin: -1px -3px;
  }
  .node-name:hover { background: var(--node-bg-2); }
  .node-name.selected-name { background: var(--accent); color: #fff; }
  .node-name .cls { color: var(--dim); font-weight: 400; }
  .node-name.selected-name .cls { color: #dce8ff; }
  .badge.err { display: inline-block; font-size: 10px; margin-left: 4px; padding: 1px 6px;
    border-radius: 10px; background: #4a2020; color: #ff9a9a; border: 1px solid #6b2b2b; }
  .transforms { margin: 4px 0 0; font-size: 11px; }
  .transforms span {
    display: inline-block; background: var(--node-bg-2); border-radius: 8px; cursor: pointer;
    padding: 1px 6px; margin: 2px 2px 0 0; color: var(--dim);
  }
  .transforms span:hover { filter: brightness(1.3); }
  .transforms span.selected-transform { background: var(--accent); color: #fff; }
  .children { margin-top: 4px; }
  .collapsed-summary { font-size: 11px; color: var(--dim); margin-top: 4px; }
  .collapsed-child {
    display: inline-block; margin: 2px 4px 0 0; padding: 1px 6px; border-radius: 8px;
    background: var(--node-bg-2); border: 1px solid var(--border); font-size: 11px; color: var(--dim);
  }
  .menu {
    position: fixed; z-index: 1000; background: var(--panel); border: 1px solid var(--border);
    border-radius: 6px; padding: 4px; display: flex; flex-direction: column; gap: 2px;
    box-shadow: 0 4px 16px rgba(0,0,0,.4);
  }
  .menu button { background: transparent; color: var(--text); text-align: left; border-radius: 4px; }
  .menu button:hover { background: var(--node-bg-2); }
  .menu hr { border: none; border-top: 1px solid var(--border); width: 100%; margin: 2px 0; }
</style>
</head>
<body>
  <div id="topbar">
    <span id="pwd">pwd: …</span>
    <span id="selection">(nothing selected)</span>
    <input id="cmdline" placeholder="fatass command, e.g. build Lectures[0].Topics" />
    <button id="run">Run</button>
    <button id="refresh">Refresh</button>
  </div>
  <div id="main">
    <div id="canvas">
      <div id="tree"></div>
      <svg id="arrows"><defs>
        <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
          <path d="M0,0 L8,4 L0,8 Z" fill="#5c9eff"/>
        </marker>
      </defs></svg>
    </div>
    <div id="console">
      <h3>Output</h3>
      <div id="output"></div>
    </div>
  </div>
  <script>
    let treeRoot = null;       // last-fetched tree JSON (single root node, or the synthetic root wrapper)
    let currentPwd = "";
    // The root sentinel and its parenthesized spelling -- fetched once from
    // /api/root (see gui/server.py) rather than hardcoded here, so
    // fatass.resolve.cwd.ROOT/PAREN_ROOT stay the one place that defines
    // them; every absolute path this page builds goes through absPath()
    // below instead of inlining these directly.
    let ROOT = "";
    let PAREN_ROOT = "";

    function absPath(pascalPath) {
      return pascalPath ? `${ROOT}${pascalPath}` : PAREN_ROOT;
    }
    const collapsed = new Set();          // paths currently shown collapsed (direct-children-only)
    let selection = null;                 // {type:'node', path} | {type:'transform', path, name}
    const nameElByPath = new Map();        // path -> .node-name element (arrow endpoints)
    const transformElByKey = new Map();    // "path::transform" -> .transforms span element

    function el(tag, cls, text) {
      const e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text !== undefined) e.textContent = text;
      return e;
    }

    function transformKey(path, name) { return `${path}::${name}`; }

    function findNode(node, path) {
      if (!node) return null;
      if (node.path === path) return node;
      for (const child of node.children || []) {
        const found = findNode(child, path);
        if (found) return found;
      }
      return null;
    }

    // ---- selection + arrows -------------------------------------------------

    function setSelectionLabel(text) {
      document.getElementById("selection").textContent = text;
    }

    function clearSelectionHighlight() {
      document.querySelectorAll(".selected-node").forEach(n => n.classList.remove("selected-node"));
      document.querySelectorAll(".selected-name").forEach(n => n.classList.remove("selected-name"));
      document.querySelectorAll(".selected-transform").forEach(n => n.classList.remove("selected-transform"));
    }

    function collectArrows(node, arrows) {
      for (const tr of node.transforms || []) {
        for (const dep of tr.dependencies) {
          arrows.push({ from: dep.path, to: transformKey(node.path, tr.name) });
        }
      }
      // "recursely for its expanded subnode" — a collapsed node's children
      // aren't drawn at all, so their transforms/dependencies are skipped too.
      if (!collapsed.has(node.path)) {
        for (const child of node.children || []) collectArrows(child, arrows);
      }
    }

    function selectNode(path) {
      selection = { type: "node", path };
      setSelectionLabel(absPath(toPascalPath(path)));
      clearSelectionHighlight();
      const nameEl = nameElByPath.get(path);
      if (nameEl) {
        nameEl.classList.add("selected-name");
        const box = nameEl.closest(".node");
        if (box) box.classList.add("selected-node");
      }
      const node = findNode(treeRoot, path);
      const arrows = [];
      if (node) collectArrows(node, arrows);
      drawArrows(arrows);
    }

    function selectTransform(path, name, dependencies) {
      selection = { type: "transform", path, name };
      setSelectionLabel(`${absPath(toPascalPath(path))} :: ${name}()`);
      clearSelectionHighlight();
      const trEl = transformElByKey.get(transformKey(path, name));
      if (trEl) trEl.classList.add("selected-transform");
      const arrows = dependencies.map(dep => ({ from: dep.path, to: transformKey(path, name) }));
      drawArrows(arrows);
    }

    function reapplySelection() {
      if (!selection) return;
      if (selection.type === "node") {
        selectNode(selection.path);
      } else {
        const node = findNode(treeRoot, selection.path);
        const tr = node && (node.transforms || []).find(t => t.name === selection.name);
        if (tr) selectTransform(selection.path, selection.name, tr.dependencies);
      }
    }

    function rectRelativeToCanvas(e) {
      const canvas = document.getElementById("canvas");
      const cRect = canvas.getBoundingClientRect();
      const r = e.getBoundingClientRect();
      return {
        left: r.left - cRect.left + canvas.scrollLeft,
        top: r.top - cRect.top + canvas.scrollTop,
        width: r.width, height: r.height,
      };
    }

    function drawArrows(arrows) {
      const svg = document.getElementById("arrows");
      const tree = document.getElementById("tree");
      while (svg.lastChild && svg.lastChild.tagName !== "defs") svg.removeChild(svg.lastChild);
      svg.setAttribute("width", tree.scrollWidth);
      svg.setAttribute("height", tree.scrollHeight);
      for (const { from, to } of arrows) {
        const fromEl = nameElByPath.get(from);
        const toEl = transformElByKey.get(to);
        if (!fromEl || !toEl) continue; // dependency not visible (collapsed/out of view) — skip
        const a = rectRelativeToCanvas(fromEl);
        const b = rectRelativeToCanvas(toEl);
        const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
        line.setAttribute("x1", a.left + a.width / 2);
        line.setAttribute("y1", a.top + a.height / 2);
        line.setAttribute("x2", b.left + b.width / 2);
        line.setAttribute("y2", b.top + b.height / 2);
        line.setAttribute("stroke", "#5c9eff");
        line.setAttribute("stroke-width", "2");
        line.setAttribute("marker-end", "url(#arrowhead)");
        svg.appendChild(line);
      }
    }

    // ---- context menu --------------------------------------------------------

    function closeMenus() {
      document.querySelectorAll(".menu").forEach(m => m.remove());
    }

    function openMenu(x, y, items) {
      closeMenus();
      const menu = el("div", "menu");
      menu.style.left = x + "px";
      menu.style.top = y + "px";
      for (const item of items) {
        if (item === "-") { menu.appendChild(el("hr")); continue; }
        const [label, line] = item;
        const btn = el("button", null, label);
        btn.onclick = (e) => { e.stopPropagation(); closeMenus(); if (line) runLine(line); };
        menu.appendChild(btn);
      }
      document.body.appendChild(menu);
    }

    // "node1_seg.node2_seg" -> "Node1Seg.Node2Seg" -- the PascalCase form
    // the Node.transform transform-target grammar needs (see
    // fatass.commands._targets._pascal_path_to_snake, whose inverse this
    // is), preserving any "[idx]" chain-index suffix on a segment as-is.
    function toPascalPath(path) {
      return path.split(".").map(seg => {
        const bracketIdx = seg.indexOf("[");
        const name = bracketIdx === -1 ? seg : seg.slice(0, bracketIdx);
        const suffix = bracketIdx === -1 ? "" : seg.slice(bracketIdx);
        const pascal = name.split("_").filter(Boolean)
          .map(w => w.charAt(0).toUpperCase() + w.slice(1)).join("");
        return pascal + suffix;
      }).join(".");
    }

    function nodeMenuItems(path) {
      // Always absolute — a relative target would resolve against
      // whatever node this GUI session's `cd` last left it at, not
      // necessarily the topology root. Every command now enforces
      // PascalCase node-path segments, so `path` (the real, on-disk
      // snake_case path) is converted before being spliced into any
      // command line; absPath() supplies the root sentinel itself.
      const p = absPath(toPascalPath(path));
      return [
        ["ls", `ls ${p}`],
        ["ls -r", `ls -r ${p}`],
        ["len", `len ${p}`],
        "-",
        ["build", `build ${p}`],
        ["run (all transforms)", `run ${p}`],
        ["apply build", `apply ${p}.build`],
        "-",
        ["push", `push ${p}`],
        ["pop", `pop ${p}`],
        "-",
        ["cd here", `cd ${p}`],
        ["purge", `purge ${p}`],
        ["remove", `remove ${p}`],
      ];
    }

    function rootMenuItems() {
      return [
        ["ls", `ls ${PAREN_ROOT}`],
        ["ls -r", `ls -r ${PAREN_ROOT}`],
        ["graph", `graph`],
        ["cd up", `cd ..`],
        [`cd ${PAREN_ROOT}`, `cd ${PAREN_ROOT}`],
      ];
    }

    // ---- rendering ------------------------------------------------------------

    // Server-computed signature string (see fatass.signature), e.g.
    // "Points<Chain>" — split at the first "<" purely for styling (bold
    // class name, dim type), the text itself is never rebuilt here.
    function renderSignatureInto(target, sigText) {
      const splitAt = sigText.indexOf("<");
      if (splitAt === -1) { target.textContent = sigText; return; }
      target.appendChild(document.createTextNode(sigText.slice(0, splitAt)));
      target.appendChild(el("span", "cls", sigText.slice(splitAt)));
    }

    function toggleCollapse(path) {
      if (collapsed.has(path)) collapsed.delete(path); else collapsed.add(path);
      renderTree();
      reapplySelection();
    }

    function renderNode(node) {
      const wrap = el("div", "node");
      wrap.dataset.path = node.path;
      wrap.onclick = (e) => { e.stopPropagation(); toggleCollapse(node.path); };
      wrap.oncontextmenu = (e) => {
        e.preventDefault(); e.stopPropagation();
        openMenu(e.clientX, e.clientY, nodeMenuItems(node.path));
      };

      const header = el("div", "node-header");
      const nameSpan = el("span", "node-name");
      renderSignatureInto(nameSpan, node.signature);
      nameSpan.onclick = (e) => { e.stopPropagation(); selectNode(node.path); };
      header.appendChild(nameSpan);
      nameElByPath.set(node.path, nameSpan);
      if (node.error) header.appendChild(el("span", "badge err", "error"));
      wrap.appendChild(header);

      const isCollapsed = collapsed.has(node.path);

      if (node.transforms && node.transforms.length) {
        const t = el("div", "transforms");
        for (const tr of node.transforms) {
          const span = el("span", null, tr.name + "()");
          span.onclick = (e) => { e.stopPropagation(); selectTransform(node.path, tr.name, tr.dependencies); };
          t.appendChild(span);
          transformElByKey.set(transformKey(node.path, tr.name), span);
        }
        wrap.appendChild(t);
      }

      if (node.children && node.children.length) {
        if (isCollapsed) {
          const summary = el("div", "collapsed-summary", "");
          for (const child of node.children) {
            const chip = el("span", "collapsed-child");
            renderSignatureInto(chip, child.signature);
            summary.appendChild(chip);
          }
          wrap.appendChild(summary);
        } else {
          const kids = el("div", "children");
          for (const child of node.children) kids.appendChild(renderNode(child));
          wrap.appendChild(kids);
        }
      }

      return wrap;
    }

    function renderTree() {
      nameElByPath.clear();
      transformElByKey.clear();
      const container = document.getElementById("tree");
      container.innerHTML = "";
      if (!treeRoot) return;
      if (treeRoot.class_name === "topology") {
        for (const child of treeRoot.children) container.appendChild(renderNode(child));
      } else {
        container.appendChild(renderNode(treeRoot));
      }
    }

    async function loadRoot() {
      const info = await (await fetch("/api/root")).json();
      ROOT = info.root;
      PAREN_ROOT = info.paren_root;
    }

    async function loadTree() {
      const [treeRes, pwdRes] = await Promise.all([fetch("/api/tree"), fetch("/api/pwd")]);
      treeRoot = await treeRes.json();
      currentPwd = (await pwdRes.json()).cwd;
      document.getElementById("pwd").textContent = `pwd: ${currentPwd}`;
      renderTree();
      reapplySelection();
    }

    async function runLine(line) {
      const out = document.getElementById("output");
      out.textContent += `>>> ${line}\n`;
      const res = await fetch("/api/command", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ line }),
      });
      const data = await res.json();
      out.textContent += data.output;
      out.scrollTop = out.scrollHeight;
      await loadTree();
    }

    document.getElementById("canvas").oncontextmenu = (e) => {
      if (e.target.id === "canvas" || e.target.id === "tree") {
        e.preventDefault();
        openMenu(e.clientX, e.clientY, rootMenuItems());
      }
    };
    // Capture phase, so an ancestor's stopPropagation() (used by node/
    // name/transform click handlers to keep a click from also toggling
    // or selecting an unrelated ancestor) can never prevent a menu from
    // being dismissed by the next click, anywhere on the page.
    document.addEventListener("click", closeMenus, true);

    document.getElementById("run").onclick = () => {
      const input = document.getElementById("cmdline");
      if (input.value.trim()) { runLine(input.value.trim()); input.value = ""; }
    };
    document.getElementById("cmdline").addEventListener("keydown", (e) => {
      if (e.key === "Enter") document.getElementById("run").click();
    });
    document.getElementById("refresh").onclick = loadTree;

    loadRoot().then(loadTree);
  </script>
</body>
</html>
