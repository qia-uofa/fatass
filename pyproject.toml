[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fatass"
version = "0.1.0"
description = "Functional Agent for Topological Asset System Synthesization"
requires-python = ">=3.10"

[project.scripts]
fatass = "fatass.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["fatass*"]
