<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sentinel — Moderation Suite Spec Builder</title>
<style>
  :root {
    --blurple: #5865F2;
    --blurple-hover: #6f76f5;
    --blurple-dim: #3c3fa8;
    --bg-deepest: #1e1f22;
    --bg-base: #232428;
    --bg-card: #2b2d31;
    --bg-field: #1e1f22;
    --bg-field-hover: #26272b;
    --border: #3f4147;
    --border-soft: #35363b;
    --text-primary: #f2f3f5;
    --text-secondary: #b5bac1;
    --text-muted: #80848e;
    --green: #23a55a;
    --red: #f23f43;
    --amber: #f0b232;
    --shadow: 0 8px 24px rgba(0,0,0,0.45);
    --radius: 10px;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "gg sans", "Helvetica Neue", Arial, sans-serif;
    --mono: "Cascadia Code", "Consolas", "SFMono-Regular", Menlo, monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: radial-gradient(circle at 20% -10%, #2f3136 0%, var(--bg-deepest) 55%);
    color: var(--text-primary);
    font-family: var(--font);
    min-height: 100vh;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 16px 64px;
  }

  .app-shell {
    width: 100%;
    max-width: 760px;
  }

  /* ---------- Header ---------- */
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 22px;
  }

  .brand-mark {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--blurple), #7f5af0);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 18px;
    box-shadow: 0 4px 14px rgba(88, 101, 242, 0.45);
    flex-shrink: 0;
  }

  .brand-text h1 {
    margin: 0;
    font-size: 19px;
    font-weight: 700;
    letter-spacing: 0.2px;
  }

  .brand-text p {
    margin: 2px 0 0;
    font-size: 12.5px;
    color: var(--text-muted);
  }

  /* ---------- Progress ---------- */
  .progress-wrap {
    margin-bottom: 22px;
  }

  .progress-track {
    height: 6px;
    border-radius: 999px;
    background: var(--bg-card);
    overflow: hidden;
    border: 1px solid var(--border-soft);
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--blurple), #7f5af0);
    border-radius: 999px;
    transition: width 0.35s ease;
    width: 0%;
  }

  .progress-steps {
    display: flex;
    justify-content: space-between;
    margin-top: 10px;
    font-size: 10.5px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .progress-steps span {
    flex: 1;
    text-align: center;
    position: relative;
    cursor: default;
  }

  .progress-steps span.done { color: var(--green); }
  .progress-steps span.current { color: var(--text-primary); font-weight: 700; }

  /* ---------- Card ---------- */
  .card {
    background: var(--bg-card);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 30px 32px 26px;
    animation: fadeIn 0.28s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .step-eyebrow {
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--blurple-hover);
    margin: 0 0 6px;
  }

  .step-title {
    font-size: 22px;
    font-weight: 700;
    margin: 0 0 6px;
  }

  .step-desc {
    font-size: 13.5px;
    color: var(--text-secondary);
    margin: 0 0 24px;
    line-height: 1.5;
  }

  /* ---------- Fields ---------- */
  .field {
    margin-bottom: 20px;
  }

  .field label.field-label {
    display: block;
    font-size: 12.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    color: var(--text-secondary);
    margin-bottom: 8px;
  }

  .field .hint {
    font-size: 12px;
    color: var(--text-muted);
    margin: -4px 0 8px;
  }

  input[type="text"],
  input[type="number"],
  textarea,
  select {
    width: 100%;
    background: var(--bg-field);
    border: 1px solid var(--border);
    color: var(--text-primary);
    font-family: var(--font);
    font-size: 14.5px;
    padding: 11px 12px;
    border-radius: 8px;
    outline: none;
    transition: border-color 0.15s ease, background 0.15s ease;
  }

  input[type="text"]:focus,
  input[type="number"]:focus,
  textarea:focus,
  select:focus {
    border-color: var(--blurple);
    background: var(--bg-field-hover);
  }

  textarea {
    resize: vertical;
    min-height: 80px;
    line-height: 1.5;
  }

  select {
    appearance: none;
    -webkit-appearance: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%23b5bac1' stroke-width='2'><polyline points='6 9 12 15 18 9'/></svg>");
    background-repeat: no-repeat;
    background-position: right 12px center;
    padding-right: 34px;
  }

  .check-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
  }

  .check-item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    background: var(--bg-field);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
  }

  .check-item:hover {
    border-color: var(--blurple-dim);
    background: var(--bg-field-hover);
  }

  .check-item.checked {
    border-color: var(--blurple);
    background: rgba(88, 101, 242, 0.12);
  }

  .check-item input {
    margin-top: 2px;
    accent-color: var(--blurple);
    width: 15px;
    height: 15px;
    flex-shrink: 0;
  }

  .check-item .ci-text {
    font-size: 13px;
    line-height: 1.4;
  }

  .check-item .ci-text strong {
    display: block;
    font-size: 13.5px;
    font-weight: 600;
  }

  .check-item .ci-text small {
    color: var(--text-muted);
    font-size: 11.5px;
  }

  .toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--bg-field);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    margin-bottom: 12px;
  }

  .toggle-row .tr-text strong {
    font-size: 13.5px;
    font-weight: 600;
    display: block;
  }

  .toggle-row .tr-text span {
    font-size: 11.5px;
    color: var(--text-muted);
  }

  .switch {
    position: relative;
    width: 40px;
    height: 22px;
    flex-shrink: 0;
  }

  .switch input {
    opacity: 0;
    width: 0;
    height: 0;
  }

  .slider {
    position: absolute;
    cursor: pointer;
    inset: 0;
    background: var(--border);
    border-radius: 999px;
    transition: 0.2s;
  }

  .slider::before {
    content: "";
    position: absolute;
    height: 16px;
    width: 16px;
    left: 3px;
    top: 3px;
    background: var(--text-primary);
    border-radius: 50%;
    transition: 0.2s;
  }

  .switch input:checked + .slider {
    background: var(--blurple);
  }

  .switch input:checked + .slider::before {
    transform: translateX(18px);
  }

  .radio-pill-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .radio-pill {
    border: 1px solid var(--border);
    background: var(--bg-field);
    border-radius: 999px;
    padding: 8px 16px;
    font-size: 12.5px;
    cursor: pointer;
    color: var(--text-secondary);
    transition: all 0.15s ease;
  }

  .radio-pill input { display: none; }

  .radio-pill.checked {
    background: var(--blurple);
    border-color: var(--blurple);
    color: #fff;
    font-weight: 600;
  }

  /* ---------- Nav ---------- */
  .nav-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 28px;
    gap: 12px;
  }

  button {
    font-family: var(--font);
    font-size: 14px;
    font-weight: 600;
    border-radius: 8px;
    padding: 11px 22px;
    border: none;
    cursor: pointer;
    transition: background 0.15s ease, opacity 0.15s ease, transform 0.1s ease;
  }

  button:active { transform: translateY(1px); }

  .btn-primary {
    background: var(--blurple);
    color: #fff;
  }

  .btn-primary:hover { background: var(--blurple-hover); }

  .btn-ghost {
    background: transparent;
    color: var(--text-secondary);
    border: 1px solid var(--border);
  }

  .btn-ghost:hover { color: var(--text-primary); border-color: var(--text-muted); }

  .btn-primary:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }

  .nav-spacer { flex: 1; }

  /* ---------- Review ---------- */
  .review-section {
    border: 1px solid var(--border-soft);
    border-radius: 8px;
    padding: 14px 16px;
    margin-bottom: 14px;
    background: var(--bg-field);
  }

  .review-section h3 {
    margin: 0 0 10px;
    font-size: 12.5px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--blurple-hover);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .review-section h3 button {
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 11px;
    font-weight: 600;
    text-transform: none;
    letter-spacing: 0;
    cursor: pointer;
    padding: 2px 8px;
  }

  .review-section h3 button:hover { color: var(--blurple-hover); }

  .review-row {
    display: flex;
    gap: 10px;
    font-size: 13px;
    padding: 5px 0;
    border-bottom: 1px dashed var(--border-soft);
  }

  .review-row:last-child { border-bottom: none; }

  .review-row .rk {
    color: var(--text-muted);
    min-width: 170px;
    flex-shrink: 0;
  }

  .review-row .rv {
    color: var(--text-primary);
    word-break: break-word;
  }

  .review-row .rv.empty {
    color: var(--text-muted);
    font-style: italic;
  }

  .tag-chip {
    display: inline-block;
    background: rgba(88, 101, 242, 0.16);
    color: #c7cbfd;
    border: 1px solid var(--blurple-dim);
    border-radius: 999px;
    padding: 2px 9px;
    font-size: 11.5px;
    margin: 2px 4px 2px 0;
  }

  /* ---------- Toast / status ---------- */
  .status-banner {
    display: none;
    align-items: center;
    gap: 10px;
    background: rgba(35, 165, 90, 0.12);
    border: 1px solid var(--green);
    color: #7ef2ab;
    padding: 14px 16px;
    border-radius: 8px;
    font-size: 13.5px;
    margin-bottom: 18px;
  }

  .status-banner.error {
    background: rgba(242, 63, 67, 0.12);
    border-color: var(--red);
    color: #ffb3b5;
  }

  .status-banner.show { display: flex; }

  .success-screen {
    text-align: center;
    padding: 26px 10px 10px;
  }

  .success-screen .glyph {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: rgba(35, 165, 90, 0.15);
    border: 2px solid var(--green);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 18px;
    font-size: 26px;
    color: var(--green);
  }

  .success-screen h2 {
    margin: 0 0 8px;
    font-size: 20px;
  }

  .success-screen p {
    color: var(--text-secondary);
    font-size: 13.5px;
    line-height: 1.6;
  }

  .success-screen code {
    background: var(--bg-field);
    border: 1px solid var(--border);
    padding: 2px 6px;
    border-radius: 4px;
    font-family: var(--mono);
    font-size: 12px;
  }

  footer.hint-foot {
    text-align: center;
    color: var(--text-muted);
    font-size: 11.5px;
    margin-top: 20px;
  }

  @media (max-width: 560px) {
    .check-grid { grid-template-columns: 1fr; }
    .card { padding: 22px 18px 20px; }
    .review-row { flex-direction: column; gap: 2px; }
    .review-row .rk { min-width: 0; }
  }
</style>
</head>
<body>
<div class="app-shell">

  <div class="brand">
    <div class="brand-mark">🛡️</div>
    <div class="brand-text">
      <h1>Sentinel Spec Builder</h1>
      <p>Discord all-in-one moderation app &amp; web portal — project specification</p>
    </div>
  </div>

  <div class="progress-wrap">
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-steps" id="progressSteps"></div>
  </div>

  <div id="statusBanner" class="status-banner"></div>

  <div class="card" id="cardRoot"></div>

  <footer class="hint-foot">Answers are saved to <code>spec.json</code> only when you submit on the review page.</footer>
</div>

<script>
(function () {
  "use strict";

  /* ---------------------------------------------------------------
   * Step / schema definitions
   * ------------------------------------------------------------- */
  var STEPS = [
    { id: "overview", label: "Overview" },
    { id: "scope", label: "Scope" },
    { id: "automod", label: "Auto-Mod" },
    { id: "modtools", label: "Mod Tools" },
    { id: "portal", label: "Web Portal" },
    { id: "roles", label: "Roles" },
    { id: "integrations", label: "Integrations" },
    { id: "data", label: "Data" },
    { id: "technical", label: "Technical" },
    { id: "review", label: "Review" }
  ];

  var state = {
    overview: {
      projectName: "",
      tagline: "",
      description: "",
      targetAudience: "",
      primaryGoals: [],
      successMetrics: ""
    },
    scope: {
      inScope: [],
      outOfScope: "",
      targetServerSize: "growing",
      launchPlatforms: []
    },
    automod: {
      filters: [],
      raidThreshold: "",
      escalationNotes: ""
    },
    modtools: {
      manualActions: [],
      caseManagement: true,
      appealsProcess: false,
      appealsNotes: ""
    },
    portal: {
      dashboardFeatures: [],
      authMethod: "discord_oauth",
      realtimeUpdates: true,
      mobileResponsive: true
    },
    roles: {
      permissionLevels: [],
      auditLogging: true,
      customPermissionBuilder: false,
      notes: ""
    },
    integrations: {
      slashCommands: true,
      webhookSupport: true,
      externalServices: [],
      coexistWithOtherBots: true,
      notes: ""
    },
    data: {
      dataRetentionDays: "90",
      gdprCompliance: true,
      piiHandling: "hash",
      selfHostOption: false,
      notes: ""
    },
    technical: {
      hostingModel: "cloud",
      techStack: "",
      targetServerCount: "small",
      uptimeTarget: "99.9",
      budgetNotes: ""
    }
  };

  var current = 0;

  /* ---------------------------------------------------------------
   * Field option catalogs
   * ------------------------------------------------------------- */
  var OPT = {
    primaryGoals: [
      ["reduce_workload", "Reduce moderator workload", "Automate repetitive enforcement"],
      ["faster_response", "Faster incident response", "Cut time-to-action on violations"],
      ["consistency", "Consistent rule enforcement", "Remove human bias/inconsistency"],
      ["visibility", "Better visibility for owners", "Centralized reporting off-Discord"],
      ["scale", "Support multi-server scale", "One install, many guilds"],
      ["community_trust", "Improve community trust", "Transparent, fair moderation"]
    ],
    inScope: [
      ["automod_engine", "Automated moderation engine", "Spam, raids, filters"],
      ["manual_tools", "Manual moderator commands", "Kick/ban/mute/warn"],
      ["web_dashboard", "Web portal dashboard", "Config + live monitoring"],
      ["case_system", "Case & incident tracking", "History per member"],
      ["analytics", "Server analytics & reports", "Trends, charts, exports"],
      ["ticketing", "Support ticket system", "Member help requests"],
      ["appeals", "Ban/mute appeal workflow", "Off-platform appeal form"],
      ["multi_guild", "Multi-server management", "One dashboard, many guilds"]
    ],
    launchPlatforms: [
      ["discord_bot", "Discord bot", "Core moderation runtime"],
      ["web_portal", "Web portal", "Browser dashboard"],
      ["mobile_web", "Mobile-friendly web", "Responsive portal on phones"],
      ["public_api", "Public REST API", "Third-party integrations"]
    ],
    filters: [
      ["spam", "Spam detection", "Message flood & duplicate content"],
      ["raid", "Raid protection", "Mass-join / coordinated attacks"],
      ["profanity", "Profanity filter", "Custom + built-in word lists"],
      ["links", "Link & invite filter", "Unapproved domains, invite links"],
      ["nsfw_image", "NSFW image detection", "Scan attachments/embeds"],
      ["phishing", "Phishing/scam link detection", "Known malicious domains"],
      ["mass_mention", "Mass-mention protection", "@everyone / mass ping abuse"],
      ["caps_emoji", "Caps & emoji spam limits", "Excessive formatting abuse"]
    ],
    manualActions: [
      ["kick", "Kick", "Remove from server"],
      ["ban", "Ban", "Permanent removal"],
      ["softban", "Softban", "Ban + unban to purge messages"],
      ["timeout", "Timeout / mute", "Temporary silence"],
      ["warn", "Warn", "Logged verbal warning"],
      ["purge", "Bulk message purge", "Clear channel history"],
      ["lockdown", "Channel/server lockdown", "Emergency freeze"],
      ["role_strip", "Strip roles", "Remove privileges without ban"]
    ],
    dashboardFeatures: [
      ["live_log", "Live moderation log", "Real-time action feed"],
      ["member_mgmt", "Member management", "Search, filter, bulk actions"],
      ["config_editor", "Guild config editor", "Rules, filters, thresholds"],
      ["analytics_charts", "Analytics & charts", "Activity, action trends"],
      ["audit_viewer", "Audit log viewer", "Full staff action history"],
      ["multi_server_switch", "Multi-server switcher", "Manage several guilds"],
      ["case_detail", "Case detail pages", "Per-incident timeline"],
      ["role_permission_ui", "Role/permission editor", "GUI for access control"]
    ],
    permissionLevels: [
      ["owner", "Owner", "Full control, billing"],
      ["admin", "Admin", "Full moderation + config"],
      ["moderator", "Moderator", "Standard enforcement actions"],
      ["trial_mod", "Trial moderator", "Limited actions, logged closely"],
      ["auditor", "Read-only auditor", "View logs, no actions"]
    ],
    externalServices: [
      ["twitch", "Twitch", "Stream-live notifications"],
      ["youtube", "YouTube", "Upload/live notifications"],
      ["reddit", "Reddit", "Subreddit post feeds"],
      ["x_twitter", "X / Twitter", "Post feeds & alerts"],
      ["custom_api", "Custom API", "Bespoke external integration"],
      ["zapier", "Zapier / IFTTT", "No-code automation hooks"]
    ]
  };

  var SELECT = {
    targetServerSize: [
      ["small", "Small community (<1k members)"],
      ["growing", "Growing community (1k–20k)"],
      ["large", "Large community (20k–100k)"],
      ["enterprise", "Enterprise scale (100k+)"]
    ],
    authMethod: [
      ["discord_oauth", "Discord OAuth2 only"],
      ["discord_2fa", "Discord OAuth2 + enforced 2FA"],
      ["sso", "SSO (enterprise identity provider)"]
    ],
    piiHandling: [
      ["raw", "Store raw message content"],
      ["hash", "Hash/anonymize after retention window"],
      ["none", "Never store message content"]
    ],
    hostingModel: [
      ["cloud", "Managed cloud SaaS"],
      ["self_hosted", "Self-hosted (customer infra)"],
      ["hybrid", "Hybrid (cloud bot, self-hosted data)"]
    ],
    targetServerCount: [
      ["single", "Single flagship server"],
      ["small", "Dozens of servers"],
      ["mid", "Hundreds of servers"],
      ["large", "Thousands+ (public bot)"]
    ],
    uptimeTarget: [
      ["99", "99% (best effort)"],
      ["99.9", "99.9% (production standard)"],
      ["99.99", "99.99% (mission-critical)"]
    ]
  };

  /* ---------------------------------------------------------------
   * Rendering helpers
   * ------------------------------------------------------------- */
  var root = document.getElementById("cardRoot");

  function el(tag, attrs, children) {
    var e = document.createElement(tag);
    if (attrs) {
      Object.keys(attrs).forEach(function (k) {
        if (k === "class") e.className = attrs[k];
        else if (k === "html") e.innerHTML = attrs[k];
        else if (k === "text") e.textContent = attrs[k];
        else e.setAttribute(k, attrs[k]);
      });
    }
    (children || []).forEach(function (c) { if (c) e.appendChild(c); });
    return e;
  }

  function fieldLabel(text, hint) {
    var wrap = document.createDocumentFragment();
    wrap.appendChild(el("label", { class: "field-label", text: text }));
    if (hint) wrap.appendChild(el("p", { class: "hint", text: hint }));
    return wrap;
  }

  function textInput(section, key, placeholder) {
    var input = el("input", { type: "text", placeholder: placeholder || "" });
    input.value = state[section][key] || "";
    input.addEventListener("input", function () { state[section][key] = input.value; });
    return input;
  }

  function textArea(section, key, placeholder) {
    var ta = el("textarea", { placeholder: placeholder || "" });
    ta.value = state[section][key] || "";
    ta.addEventListener("input", function () { state[section][key] = ta.value; });
    return ta;
  }

  function selectInput(section, key, options) {
    var sel = el("select", {});
    options.forEach(function (opt) {
      var o = el("option", { value: opt[0], text: opt[1] });
      sel.appendChild(o);
    });
    sel.value = state[section][key];
    sel.addEventListener("change", function () { state[section][key] = sel.value; });
    return sel;
  }

  function checkGrid(section, key, options) {
    var grid = el("div", { class: "check-grid" });
    var selected = state[section][key];
    options.forEach(function (opt) {
      var id = section + "_" + key + "_" + opt[0];
      var isChecked = selected.indexOf(opt[0]) !== -1;
      var input = el("input", { type: "checkbox", id: id });
      input.checked = isChecked;
      var item = el("label", { class: "check-item" + (isChecked ? " checked" : ""), for: id }, [
        input,
        el("span", { class: "ci-text" }, [
          el("strong", { text: opt[1] }),
          el("small", { text: opt[2] || "" })
        ])
      ]);
      input.addEventListener("change", function () {
        var arr = state[section][key];
        var idx = arr.indexOf(opt[0]);
        if (input.checked && idx === -1) arr.push(opt[0]);
        if (!input.checked && idx !== -1) arr.splice(idx, 1);
        item.className = "check-item" + (input.checked ? " checked" : "");
      });
      grid.appendChild(item);
    });
    return grid;
  }

  function toggleRow(section, key, title, desc) {
    var input = el("input", { type: "checkbox" });
    input.checked = !!state[section][key];
    input.addEventListener("change", function () { state[section][key] = input.checked; });
    var switchEl = el("label", { class: "switch" }, [input, el("span", { class: "slider" })]);
    return el("div", { class: "toggle-row" }, [
      el("div", { class: "tr-text" }, [
        el("strong", { text: title }),
        el("span", { text: desc || "" })
      ]),
      switchEl
    ]);
  }

  function radioPills(section, key, options) {
    var wrap = el("div", { class: "radio-pill-row" });
    var name = section + "_" + key;
    options.forEach(function (opt) {
      var input = el("input", { type: "radio", name: name, value: opt[0] });
      input.checked = state[section][key] === opt[0];
      var pill = el("label", { class: "radio-pill" + (input.checked ? " checked" : "") }, [
        input, document.createTextNode(opt[1])
      ]);
      input.addEventListener("change", function () {
        state[section][key] = opt[0];
        wrap.querySelectorAll(".radio-pill").forEach(function (p) { p.classList.remove("checked"); });
        pill.classList.add("checked");
      });
      wrap.appendChild(pill);
    });
    return wrap;
  }

  function field(children) {
    return el("div", { class: "field" }, children);
  }

  /* ---------------------------------------------------------------
   * Step builders
   * ------------------------------------------------------------- */
  var BUILDERS = {
    overview: function () {
      var frag = document.createDocumentFragment();
      frag.appendChild(header("Project Overview", "Start with the identity and purpose of the moderation suite — this frames every decision that follows."));

      frag.appendChild(field([
        fieldLabel("Project name"),
        textInput("overview", "projectName", "e.g. Sentinel")
      ]));
      frag.appendChild(field([
        fieldLabel("Tagline", "One sentence describing the product."),
        textInput("overview", "tagline", "e.g. All-in-one moderation, without the busywork.")
      ]));
      frag.appendChild(field([
        fieldLabel("Description", "What is this app, and what problem does it solve for server owners?"),
        textArea("overview", "description", "Describe the product in a few sentences...")
      ]));
      frag.appendChild(field([
        fieldLabel("Target audience", "Who runs the servers that will use this?"),
        textInput("overview", "targetAudience", "e.g. Gaming communities, creator fan servers, startups")
      ]));
      frag.appendChild(field([
        fieldLabel("Primary goals", "Select every goal this project should be judged against.")
      ]));
      frag.appendChild(checkGrid("overview", "primaryGoals", OPT.primaryGoals));
      frag.appendChild(field([
        fieldLabel("Success metrics", "How will you know this is working?"),
        textArea("overview", "successMetrics", "e.g. 50% drop in manual mod actions within 60 days")
      ]));
      return frag;
    },

    scope: function () {
      var frag = document.createDocumentFragment();
      frag.appendChild(header("Scope", "Define what ships in v1 versus what's explicitly deferred."));

      frag.appendChild(field([fieldLabel("In scope", "Capabilities included in this project.")]));
      frag.appendChild(checkGrid("scope", "inScope", OPT.inScope));

      frag.appendChild(field([
        fieldLabel("Out of scope", "Explicitly excluded — call out anything people might assume is included."),
        textArea("scope", "outOfScope", "e.g. Voice channel moderation, custom mobile app, in-house hosting")
      ]));

      frag.appendChild(field([fieldLabel("Target community size", "Sets expectations for scale and moderation load.")]));
      frag.appendChild(radioPills("scope", "targetServerSize", SELECT.targetServerSize));

      frag.appendChild(field([fieldLabel("Launch platforms", "Surfaces this project ships on.")]));
      frag.appendChild(checkGrid("scope", "launchPlatforms", OPT.launchPlatforms));
      return frag;
    },

    automod: function () {
      var frag = document.createDocumentFragment();
      frag.appendChild(header("Automated Moderation", "The always-on engine that acts without a human in the loop."));

      frag.appendChild(field([fieldLabel("Automated filters", "Select every detection/enforcement capability required.")]));
      frag.appendChild(checkGrid("automod", "filters", OPT.filters));

      frag.appendChild(field([
        fieldLabel("Raid join threshold", "e.g. joins per 10s that trigger raid mode"),
        textInput("automod", "raidThreshold", "e.g. 10 joins / 10 seconds")
      ]));
      frag.appendChild(field([
        fieldLabel("Escalation behavior", "What happens after repeated violations?"),
        textArea("automod", "escalationNotes", "e.g. 3 auto-warns escalate to timeout, then mod review")
      ]));
      return frag;
    },

    modtools: function () {
      var frag = document.createDocumentFragment();
      frag.appendChild(header("Manual Moderation & Case Management", "Tools human moderators reach for, and how incidents are tracked."));

      frag.appendChild(field([fieldLabel("Manual actions", "Commands available to human moderators.")]));
      frag.appendChild(checkGrid("modtools", "manualActions", OPT.manualActions));

      frag.appendChild(toggleRow("modtools", "caseManagement", "Case management system", "Track incidents with history per member"));
      frag.appendChild(toggleRow("modtools", "appealsProcess", "Appeals process", "Let sanctioned members contest actions"));
      frag.appendChild(field([
        fieldLabel("Appeals notes", "How should appeals be reviewed and by whom?"),
        textArea("modtools", "appealsNotes", "e.g. Appeals submitted via portal form, reviewed by Admins within 48h")
      ]));
      return frag;
    },

    portal: function () {
      var frag = document.createDocumentFragment();
      frag.appendChild(header("Web Portal", "The dashboard moderators and owners live in outside of Discord."));

      frag.appendChild(field([fieldLabel("Dashboard features", "What the portal needs to surface.")]));
      frag.appendChild(checkGrid("portal", "dashboardFeatures", OPT.dashboardFeatures));

      frag.appendChild(field([fieldLabel("Authentication method")]));
      frag.appendChild(radioPills("portal", "authMethod", SELECT.authMethod));

      frag.appendChild(toggleRow("portal", "realtimeUpdates", "Real-time updates", "Live-push log/dashboard via websockets"));
      frag.appendChild(toggleRow("portal", "mobileResponsive", "Mobile-responsive layout", "Fully usable on phone-sized screens"));
      return frag;
    },

    roles: function () {
      var frag = document.createDocumentFragment();
      frag.appendChild(header("Roles & Permissions", "Who can do what, and how access is audited."));

      frag.appendChild(field([fieldLabel("Permission levels", "Access tiers the system must support.")]));
      frag.appendChild(checkGrid("roles", "permissionLevels", OPT.permissionLevels));

      frag.appendChild(toggleRow("roles", "auditLogging", "Audit logging", "Every staff action recorded with actor & timestamp"));
      frag.appendChild(toggleRow("roles", "customPermissionBuilder", "Custom permission builder", "Let owners define bespoke permission sets"));
      frag.appendChild(field([
        fieldLabel("Notes", "Anything specific about how access control should behave."),
        textArea("roles", "notes", "e.g. Trial mods can warn/timeout but not ban")
      ]));
      return frag;
    },

    integrations: function () {
      var frag = document.createDocumentFragment();
      frag.appendChild(header("Bot Behavior & Integrations", "How the bot interacts with Discord's platform and the outside world."));

      frag.appendChild(toggleRow("integrations", "slashCommands", "Slash commands", "Primary command interface inside Discord"));
      frag.appendChild(toggleRow("integrations", "webhookSupport", "Webhook support", "Outbound events to external systems"));
      frag.appendChild(toggleRow("integrations", "coexistWithOtherBots", "Coexist with other bots", "Avoid command/permission conflicts with existing bots"));

      frag.appendChild(field([fieldLabel("External service integrations")]));
      frag.appendChild(checkGrid("integrations", "externalServices", OPT.externalServices));

      frag.appendChild(field([
        fieldLabel("Notes", "Any other integration or bot-behavior requirements."),
        textArea("integrations", "notes", "e.g. Must not conflict with existing music bot's slash commands")
      ]));
      return frag;
    },

    data: function () {
      var frag = document.createDocumentFragment();
      frag.appendChild(header("Data & Privacy", "How member data is stored, retained, and protected."));

      frag.appendChild(field([
        fieldLabel("Data retention (days)", "How long moderation logs & message snapshots are kept."),
        (function () {
          var input = el("input", { type: "number", min: "0", placeholder: "90" });
          input.value = state.data.dataRetentionDays;
          input.addEventListener("input", function () { state.data.dataRetentionDays = input.value; });
          return input;
        })()
      ]));

      frag.appendChild(toggleRow("data", "gdprCompliance", "GDPR / data-subject compliance", "Support export & deletion requests"));

      frag.appendChild(field([fieldLabel("PII handling for logged content")]));
      frag.appendChild(radioPills("data", "piiHandling", SELECT.piiHandling));

      frag.appendChild(toggleRow("data", "selfHostOption", "Offer self-hosted deployment", "For privacy-sensitive customers"));
      frag.appendChild(field([
        fieldLabel("Notes", "Any compliance regimes or data-handling constraints to call out."),
        textArea("data", "notes", "e.g. COPPA considerations for servers with minors")
      ]));
      return frag;
    },

    technical: function () {
      var frag = document.createDocumentFragment();
      frag.appendChild(header("Technical Constraints", "Infrastructure, scale, and delivery constraints for the build."));

      frag.appendChild(field([fieldLabel("Hosting model")]));
      frag.appendChild(radioPills("technical", "hostingModel", SELECT.hostingModel));

      frag.appendChild(field([
        fieldLabel("Preferred tech stack", "Languages/frameworks/datastores, if there's a preference."),
        textInput("technical", "techStack", "e.g. Python, discord.py, Postgres, React")
      ]));

      frag.appendChild(field([fieldLabel("Target server count", "Rough scale to design for.")]));
      frag.appendChild(radioPills("technical", "targetServerCount", SELECT.targetServerCount));

      frag.appendChild(field([fieldLabel("Uptime target")]));
      frag.appendChild(radioPills("technical", "uptimeTarget", SELECT.uptimeTarget));

      frag.appendChild(field([
        fieldLabel("Budget / resourcing notes", "Constraints on infra spend, team size, or timeline."),
        textArea("technical", "budgetNotes", "e.g. Small team, prefer managed services over self-managed infra")
      ]));
      return frag;
    },

    review: function () {
      var frag = document.createDocumentFragment();
      frag.appendChild(header("Review & Submit", "Confirm everything below before writing the spec document."));

      frag.appendChild(reviewSection("Overview", "overview", [
        ["Project name", state.overview.projectName],
        ["Tagline", state.overview.tagline],
        ["Description", state.overview.description],
        ["Target audience", state.overview.targetAudience],
        ["Primary goals", chipList(state.overview.primaryGoals, OPT.primaryGoals)],
        ["Success metrics", state.overview.successMetrics]
      ]));

      frag.appendChild(reviewSection("Scope", "scope", [
        ["In scope", chipList(state.scope.inScope, OPT.inScope)],
        ["Out of scope", state.scope.outOfScope],
        ["Target community size", labelFor(SELECT.targetServerSize, state.scope.targetServerSize)],
        ["Launch platforms", chipList(state.scope.launchPlatforms, OPT.launchPlatforms)]
      ]));

      frag.appendChild(reviewSection("Automated Moderation", "automod", [
        ["Filters", chipList(state.automod.filters, OPT.filters)],
        ["Raid join threshold", state.automod.raidThreshold],
        ["Escalation behavior", state.automod.escalationNotes]
      ]));

      frag.appendChild(reviewSection("Manual Mod & Cases", "modtools", [
        ["Manual actions", chipList(state.modtools.manualActions, OPT.manualActions)],
        ["Case management", boolText(state.modtools.caseManagement)],
        ["Appeals process", boolText(state.modtools.appealsProcess)],
        ["Appeals notes", state.modtools.appealsNotes]
      ]));

      frag.appendChild(reviewSection("Web Portal", "portal", [
        ["Dashboard features", chipList(state.portal.dashboardFeatures, OPT.dashboardFeatures)],
        ["Auth method", labelFor(SELECT.authMethod, state.portal.authMethod)],
        ["Real-time updates", boolText(state.portal.realtimeUpdates)],
        ["Mobile responsive", boolText(state.portal.mobileResponsive)]
      ]));

      frag.appendChild(reviewSection("Roles & Permissions", "roles", [
        ["Permission levels", chipList(state.roles.permissionLevels, OPT.permissionLevels)],
        ["Audit logging", boolText(state.roles.auditLogging)],
        ["Custom permission builder", boolText(state.roles.customPermissionBuilder)],
        ["Notes", state.roles.notes]
      ]));

      frag.appendChild(reviewSection("Integrations", "integrations", [
        ["Slash commands", boolText(state.integrations.slashCommands)],
        ["Webhook support", boolText(state.integrations.webhookSupport)],
        ["Coexist with other bots", boolText(state.integrations.coexistWithOtherBots)],
        ["External services", chipList(state.integrations.externalServices, OPT.externalServices)],
        ["Notes", state.integrations.notes]
      ]));

      frag.appendChild(reviewSection("Data & Privacy", "data", [
        ["Data retention (days)", state.data.dataRetentionDays],
        ["GDPR compliance", boolText(state.data.gdprCompliance)],
        ["PII handling", labelFor(SELECT.piiHandling, state.data.piiHandling)],
        ["Self-hosted option", boolText(state.data.selfHostOption)],
        ["Notes", state.data.notes]
      ]));

      frag.appendChild(reviewSection("Technical", "technical", [
        ["Hosting model", labelFor(SELECT.hostingModel, state.technical.hostingModel)],
        ["Tech stack", state.technical.techStack],
        ["Target server count", labelFor(SELECT.targetServerCount, state.technical.targetServerCount)],
        ["Uptime target", state.technical.uptimeTarget + "%"],
        ["Budget notes", state.technical.budgetNotes]
      ]));

      return frag;
    }
  };

  function header(title, desc) {
    var frag = document.createDocumentFragment();
    frag.appendChild(el("p", { class: "step-eyebrow", text: "Step " + (current + 1) + " of " + STEPS.length }));
    frag.appendChild(el("h2", { class: "step-title", text: title }));
    frag.appendChild(el("p", { class: "step-desc", text: desc }));
    return frag;
  }

  function boolText(v) { return v ? "Yes" : "No"; }

  function labelFor(options, value) {
    var found = options.filter(function (o) { return o[0] === value; })[0];
    return found ? found[1] : value;
  }

  function chipList(values, options) {
    if (!values || !values.length) return null;
    var wrap = document.createElement("span");
    values.forEach(function (v) {
      var found = options.filter(function (o) { return o[0] === v; })[0];
      wrap.appendChild(el("span", { class: "tag-chip", text: found ? found[1] : v }));
    });
    return wrap;
  }

  function reviewSection(title, stepId, rows) {
    var stepIndex = STEPS.findIndex(function (s) { return s.id === stepId; });
    var editBtn = el("button", { text: "Edit" });
    editBtn.addEventListener("click", function () { goTo(stepIndex); });

    var sec = el("div", { class: "review-section" }, [
      el("h3", {}, [document.createTextNode(title), editBtn])
    ]);

    rows.forEach(function (r) {
      var key = r[0], val = r[1];
      var rv = el("span", { class: "rv" });
      if (val instanceof Node) {
        if (!val.childNodes.length) {
          rv.className = "rv empty";
          rv.textContent = "Not specified";
        } else {
          rv.appendChild(val);
        }
      } else {
        var str = (val === null || val === undefined || val === "") ? null : String(val);
        if (str) {
          rv.textContent = str;
        } else {
          rv.className = "rv empty";
          rv.textContent = "Not specified";
        }
      }
      sec.appendChild(el("div", { class: "review-row" }, [
        el("span", { class: "rk", text: key }),
        rv
      ]));
    });

    return sec;
  }

  /* ---------------------------------------------------------------
   * Navigation / rendering
   * ------------------------------------------------------------- */
  function renderProgress() {
    var pct = (current / (STEPS.length - 1)) * 100;
    document.getElementById("progressFill").style.width = pct + "%";
    var stepsWrap = document.getElementById("progressSteps");
    stepsWrap.innerHTML = "";
    STEPS.forEach(function (s, i) {
      var cls = i < current ? "done" : (i === current ? "current" : "");
      stepsWrap.appendChild(el("span", { class: cls, text: (i + 1) + "" }));
    });
  }

  function renderStep() {
    root.innerHTML = "";
    var stepId = STEPS[current].id;

    if (stepId === "submitted") return;

    var content = BUILDERS[stepId]();
    root.appendChild(content);

    var navRow = el("div", { class: "nav-row" });
    var backBtn = el("button", { class: "btn-ghost", text: "← Back" });
    backBtn.disabled = current === 0;
    backBtn.style.visibility = current === 0 ? "hidden" : "visible";
    backBtn.addEventListener("click", function () { goTo(current - 1); });

    var spacer = el("div", { class: "nav-spacer" });

    var nextBtn;
    if (stepId === "review") {
      nextBtn = el("button", { class: "btn-primary", text: "Submit Spec" });
      nextBtn.addEventListener("click", submitSpec);
    } else {
      nextBtn = el("button", { class: "btn-primary", text: "Next →" });
      nextBtn.addEventListener("click", function () {
        if (stepId === "overview" && !state.overview.projectName.trim()) {
          showStatus("Give your project a name before continuing.", true);
          return;
        }
        hideStatus();
        goTo(current + 1);
      });
    }

    navRow.appendChild(backBtn);
    navRow.appendChild(spacer);
    navRow.appendChild(nextBtn);
    root.appendChild(navRow);

    renderProgress();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function goTo(index) {
    current = Math.max(0, Math.min(STEPS.length - 1, index));
    renderStep();
  }

  function showStatus(msg, isError) {
    var banner = document.getElementById("statusBanner");
    banner.textContent = (isError ? "⚠ " : "✓ ") + msg;
    banner.className = "status-banner show" + (isError ? " error" : "");
  }

  function hideStatus() {
    var banner = document.getElementById("statusBanner");
    banner.className = "status-banner";
  }

  function submitSpec() {
    var payload = {
      projectType: "Discord all-in-one moderation app with web portal",
      generatedAt: new Date().toISOString(),
      overview: state.overview,
      scope: state.scope,
      automatedModeration: state.automod,
      manualModerationAndCases: state.modtools,
      webPortal: state.portal,
      rolesAndPermissions: state.roles,
      integrations: state.integrations,
      dataAndPrivacy: state.data,
      technical: state.technical
    };

    var nextBtn = document.querySelector(".btn-primary");
    if (nextBtn) { nextBtn.disabled = true; nextBtn.textContent = "Submitting…"; }

    fetch("/api/spec", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    })
      .then(function (res) {
        if (!res.ok) throw new Error("Server responded with " + res.status);
        return res.json();
      })
      .then(function () {
        showSuccessScreen();
      })
      .catch(function (err) {
        showStatus("Failed to save spec: " + err.message, true);
        if (nextBtn) { nextBtn.disabled = false; nextBtn.textContent = "Submit Spec"; }
      });
  }

  function showSuccessScreen() {
    root.innerHTML = "";
    root.appendChild(el("div", { class: "success-screen" }, [
      el("div", { class: "glyph", text: "✓" }),
      el("h2", { text: "Spec saved" }),
      el("p", { html: "Your moderation suite specification has been written to <code>../spec.json</code>. You can close this tab or go back to review your answers again." })
    ]));
    var again = el("button", { class: "btn-ghost", text: "← Review answers" });
    again.style.marginTop = "18px";
    again.addEventListener("click", function () { goTo(STEPS.length - 1); });
    root.querySelector(".success-screen").appendChild(again);
    document.getElementById("progressFill").style.width = "100%";
  }

  /* ---------------------------------------------------------------
   * Load existing spec, if any, then boot
   * ------------------------------------------------------------- */
  function hydrateFromSpec(spec) {
    if (!spec || typeof spec !== "object") return;
    var map = {
      overview: spec.overview,
      scope: spec.scope,
      automod: spec.automatedModeration,
      modtools: spec.manualModerationAndCases,
      portal: spec.webPortal,
      roles: spec.rolesAndPermissions,
      integrations: spec.integrations,
      data: spec.dataAndPrivacy,
      technical: spec.technical
    };
    Object.keys(map).forEach(function (key) {
      if (map[key] && typeof map[key] === "object") {
        Object.keys(map[key]).forEach(function (field) {
          if (state[key] && Object.prototype.hasOwnProperty.call(state[key], field)) {
            state[key][field] = map[key][field];
          }
        });
      }
    });
  }

  fetch("/api/spec")
    .then(function (res) { return res.ok ? res.json() : {}; })
    .catch(function () { return {}; })
    .then(function (spec) {
      hydrateFromSpec(spec);
      renderStep();
    });
})();
</script>
</body>
</html>
